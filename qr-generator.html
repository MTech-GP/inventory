<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Code Generator — Inventory</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --border: #2e3250;
    --accent: #4f8ef7;
    --green: #3ecf8e;
    --text: #e8eaf0;
    --muted: #6b7299;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: Arial, sans-serif;
    min-height: 100vh;
    padding: 24px 16px 48px;
  }
  .top-bar {
    display: flex; align-items: center; gap: 12px; margin-bottom: 24px;
  }
  .logo-img {
    width: 40px; height: 40px; border-radius: 8px; object-fit: contain; background: white; padding: 2px;
  }
  h1 { font-size: 18px; font-weight: 600; }
  .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .controls {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 24px;
    display: flex; flex-direction: column; gap: 14px;
  }
  label { font-size: 12px; color: var(--muted); margin-bottom: 4px; display: block; }
  input, select {
    width: 100%; background: #0f1117; border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px; color: var(--text); font-size: 14px; outline: none;
  }
  input:focus, select:focus { border-color: var(--accent); }
  .row { display: flex; gap: 12px; }
  .row > div { flex: 1; }
  .btn {
    padding: 12px 20px; border-radius: 8px; border: none;
    font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity 0.2s;
  }
  .btn:hover { opacity: 0.85; }
  .btn-primary { background: var(--accent); color: white; }
  .btn-success { background: var(--green); color: #0f1117; }
  .btn-row { display: flex; gap: 10px; }
  #qr-output { display: none; }
  .qr-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }
  .qr-card {
    background: white;
    border-radius: 10px;
    padding: 12px 12px 10px;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    break-inside: avoid;
    border: 1px solid #ddd;
  }
  .qr-wrap { position: relative; display: inline-block; }
  .qr-wrap canvas { display: block; border-radius: 4px; }
  .qr-overlay {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: white;
    border-radius: 4px;
    padding: 2px;
    display: flex; align-items: center; justify-content: center;
  }
  .qr-overlay img {
    display: block;
    border-radius: 3px;
    object-fit: contain;
  }
  .qr-label {
    font-family: 'Courier New', monospace;
    font-size: 11px; color: #1a1d27; font-weight: bold; text-align: center;
  }
  .qr-name {
    font-size: 9px; color: #555; text-align: center; line-height: 1.3;
  }
  .company-name {
    font-size: 8px; color: #888; text-align: center; font-style: italic;
  }
  .count-badge {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 16px; font-size: 13px;
    color: var(--muted); margin-bottom: 16px;
  }
  .count-badge span { color: var(--accent); font-weight: 600; }
  @media print {
    body { background: white; padding: 0; }
    .controls, .top-bar, .btn-row, .count-badge { display: none !important; }
    #qr-output { display: block !important; }
    .qr-grid { grid-template-columns: repeat(4, 1fr); gap: 8px; }
  }
</style>
</head>

function parseItems(raw) {
  return raw.trim().split("\n")
    .map(line => {
      const parts = line.split("\t");
      const id = parts[0]?.trim();
      const name = parts[1]?.trim() || "";
      return { id, name };
    })
    .filter(item => item.id);
}

function generateQRs() {
  const baseUrl = document.getElementById("base-url").value.trim();
  const raw = document.getElementById("items-input").value;
  const size = parseInt(document.getElementById("qr-size").value);
  const color = document.getElementById("qr-color").value;
  const items = parseItems(raw);

  if (!items.length) {
    alert("Please paste your item IDs and names first.");
    return;
  }

  const grid = document.getElementById("qr-grid");
  grid.innerHTML = "";

  items.forEach(item => {
    const url = `${baseUrl}?id=${encodeURIComponent(item.id)}`;
    const card = document.createElement("div");
    card.className = "qr-card";

    // QR wrap with logo overlay
    const wrap = document.createElement("div");
    wrap.className = "qr-wrap";

    const qrDiv = document.createElement("div");
    wrap.appendChild(qrDiv);

    // Logo overlay
    const overlay = document.createElement("div");
    overlay.className = "qr-overlay";
    const logoImg = document.createElement("img");
    const logoSize = Math.round(size * 0.22);
    logoImg.src = LOGO_SRC;
    logoImg.width = logoSize;
    logoImg.height = logoSize;
    overlay.appendChild(logoImg);
    wrap.appendChild(overlay);

    card.appendChild(wrap);

    if (item.name) {
      const name = document.createElement("div");
      name.className = "qr-name";
      name.textContent = item.name;
      card.appendChild(name);
    }

    const company = document.createElement("div");
    company.className = "company-name";
    company.textContent = "MTECH Global Partners, Co.";
    card.appendChild(company);

    grid.appendChild(card);

    new QRCode(qrDiv, {
      text: url,
      width: size,
      height: size,
      colorDark: color,
      colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.H
    });
  });

  document.getElementById("qr-output").style.display = "block";
  document.getElementById("count-badge").innerHTML = `Generated <span>${items.length}</span> QR codes — ready to print`;
  document.getElementById("print-btn").style.display = "block";
}
</script>
